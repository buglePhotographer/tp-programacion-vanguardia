name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"         # solo se dispara si cambia algo en el backend
      - ".github/workflows/deploy-api.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api   # ghcr.io/<usuario>/<repo>/api

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # necesario para publicar en GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token automático de Actions

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=         # tag con el SHA del commit
            type=raw,value=latest    # tag "latest" siempre apunta a main

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Deploy ───────────────────────────────────────────────────────────────────
  # Descomenta y adaptá el bloque que corresponda a tu plataforma.
  # La imagen publicada en GHCR queda disponible en:
  #   ghcr.io/<usuario>/<repo>/api:latest


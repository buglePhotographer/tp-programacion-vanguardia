name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'api/**'
            frontend:
              - 'app/**'

  test-backend:
    name: Tests backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: pip install -r requirements.txt
        working-directory: api

      - name: Correr tests
        run: pytest tests/ -v
        working-directory: api
        env:
          DATABASE_URL: sqlite:///./test_ci.db
          SECRET_KEY: test-secret-key

  test-frontend:
    name: Tests frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install
        working-directory: app

      - name: Correr tests
        run: npm test
        working-directory: app

  deploy:
    name: Deploy a Render
    needs: [changes, test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

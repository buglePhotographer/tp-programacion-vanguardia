services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: plataforma_academica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plataforma_academica
      SECRET_KEY: super-secret-key-cambiar-en-produccion
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./app
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
